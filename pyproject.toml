[project]
name = "lang-ai"
version = "0.1.0"
description = "Language and AI project by amazing people"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "pandas>=2.3.3",
    "pydantic>=2.12.5",
    "pydantic-ai-slim[google,groq,huggingface,logfire,openai,openrouter]>=1.39.0",
    "requests>=2.32.5",
    "scikit-learn>=1.8.0",
    "tqdm>=4.67.1",
    "scipy>=1.16.3",
    "swifter>=1.4.0",
    "hydra-core>=1.3.2",
    "tenacity>=9.1.2",
    "streamlit>=1.52.2",
    "pycountry>=24.6.1",
    "optuna>=4.6.0",
    "joblib>=1.5.3",
    "nltk>=3.9.2",
]

[dependency-groups]
dev = [
    "ipykernel>=7.1.0",
    "pandas-stubs>=2.3.3.251219",
    "ruff>=0.14.10",
    "scipy-stubs~=1.16.3",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
exclude = ["*.ipynb"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "Q", "I"]
exclude = ["*.ipynb"]
