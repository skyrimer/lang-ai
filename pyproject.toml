[project]
name = "lang-ai"
version = "0.1.0"
description = "Language and AI project by amazing people"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pandas>=2.3.3",
    "pydantic>=2.12.5",
    "pydantic-ai-slim[groq,huggingface,logfire,mistral,openai,openrouter]>=1.39.0",
    "requests>=2.32.5",
    "scikit-learn>=1.8.0",
    "tqdm>=4.67.1",
    "tenacity>=9.1.2",
    "scipy>=1.16.3",
]

[dependency-groups]
dev = [
    "ipykernel>=7.1.0",
    "pandas-stubs>=2.3.3.251219",
    "scipy-stubs~=1.16.3",
]
