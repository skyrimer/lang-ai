# Configuration for LLM Judge Pipeline

# Sampling configuration
sample:
  input: "preprocessed_data/preprocessed_data.csv"
  output: "preprocessed_data/sample_500.csv"
  random_seed: 42
  n: 500

# Multi-judge configuration (used by main.py and run_multi_judge.py)
multi_judge:
  input: "preprocessed_data/sample_500.csv"
  system_prompt: "prompts/llmaj_prompt_by_grazie"
  results_dir: "results"
  models:
    - "openrouter:xiaomi/mimo-v2-flash:free"
    - "openrouter:deepseek/deepseek-r1-0528:free"
    - "openrouter:openai/gpt-oss-120b:free"
    - "openrouter:qwen/qwen3-235b-a22b-2507"
